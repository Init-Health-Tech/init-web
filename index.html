    <script>
      // Apply saved theme before paint to avoid a flash
      (function () {
        try {
          var t = localStorage.getItem("init-theme");
          if (t === "dark") document.documentElement.classList.add("dark");
          else document.documentElement.classList.remove("dark");
        } catch (e) {}
      })();
    </script>
